name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helpdesk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/helpdesk_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/helpdesk_test
      SESSION_SECRET: ci-session-secret-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Prisma generate + migrate test DB
        run: |
          cd apps/api
          npx prisma generate
          npx prisma migrate deploy

      - name: Typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: API tests (Vitest + Supertest)
        run: npm test -w @helpdesk/api

      - name: Web tests (Vitest + RTL)
        run: npm test -w @helpdesk/web

      - name: Production build
        run: npm run build --workspaces --if-present
